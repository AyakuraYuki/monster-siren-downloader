name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref_name }})
          if ! git rev-list origin/main | grep -q "$TAG_COMMIT"; then
            echo "❌ Tag is not from main branch"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      VERSION: ${{ github.ref_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64,           os: ubuntu-latest, target: windows_.exe }
          - { goos: windows, goarch: arm64,           os: ubuntu-latest, target: windows_.exe }
          - { goos: windows, goarch: "386",           os: ubuntu-latest, target: windows_.exe }
          - { goos: darwin,  goarch: arm64,           os: macos-latest,  target: macos_aarch64 }
          - { goos: darwin,  goarch: amd64,           os: macos-latest,  target: macos_x64 }
          - { goos: linux,   goarch: amd64,           os: ubuntu-latest, target: linux_amd64 }
          - { goos: linux,   goarch: arm64,           os: ubuntu-latest, target: linux_arm64 }
          - { goos: linux,   goarch: "386",           os: ubuntu-latest, target: linux_x86 }
          - { goos: linux,   goarch: arm,   arm: "5", os: ubuntu-latest, target: linux_arm5 }
          - { goos: linux,   goarch: arm,   arm: "6", os: ubuntu-latest, target: linux_arm6 }
          - { goos: linux,   goarch: arm,   arm: "7", os: ubuntu-latest, target: linux_arm7 }

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: mkdir -p build

      - if: ${{ matrix.goos != 'linux' }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w -X main.version=${VERSION}" -o build/msr-downloader-${{ matrix.target }}
      - if: ${{ matrix.goos == 'linux' && matrix.goarch != 'arm' }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w -X main.version=${VERSION}" -o build/msr-downloader-${{ matrix.target }}
      - if: ${{ matrix.goos == 'linux' && matrix.goarch == 'arm' }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.arm }} go build -ldflags "-s -w -X main.version=${VERSION}" -o build/msr-downloader-${{ matrix.target }}

      - if: ${{ matrix.goos != 'windows' }}
        run: chmod +x build/msr-downloader-${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.target }}
          path: build/msr-downloader-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: build
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          files: build/msr-downloader-*
          prerelease: ${{ contains(github.ref_name, '-rc') }}

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: build-*
